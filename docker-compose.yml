services:
  swarved-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swarved-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_NAME=Swarved RAG Backend
      - DEBUG=False
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=groq
      - LLM_MODEL_NAME=llama-3.1-70b-versatile
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://api.groq.com/openai/v1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"